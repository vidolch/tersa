name: anatomy

# Token anatomy of finished benchmark batches, from their uploaded transcripts.
# Writes results/analysis/<label>.md and .json and commits them.
on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Workflow run ids of bench batches, space-separated
        required: true
      label:
        description: File name for the analysis (e.g. it10-haiku)
        required: true
      price_model:
        description: Model in harness/prices.json used for the cost split
        default: claude-haiku-5-5

concurrency:
  group: summary
  cancel-in-progress: false

jobs:
  anatomy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download transcripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in ${{ inputs.run_ids }}; do
            gh run download "$id" -R "${{ github.repository }}" -p 'logs-*' -D "/tmp/logs/$id"
          done
          find /tmp/logs -name transcript.jsonl | wc -l
      - name: Analyze
        working-directory: harness/runner
        run: |
          mkdir -p ../../results/analysis
          node src/anatomy.ts /tmp/logs --price "${{ inputs.price_model }}" \
            --json "../../results/analysis/${{ inputs.label }}.json" | tee "../../results/analysis/${{ inputs.label }}.md"
          cat "../../results/analysis/${{ inputs.label }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/analysis
          git commit -qm "anatomy: ${{ inputs.label }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
