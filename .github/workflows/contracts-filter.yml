name: contracts-filter

# Keeps only the contracts that add information beyond name, signature and comments
# (query/src/contracts-filter.ts), judged by a model on the suite's pristine code. Iteration 23.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite whose pristine code the contracts describe
        default: actual
      input:
        description: Contracts JSON (repo path)
        default: arms/Q-pi-contracts/contracts.actual.json
      output:
        description: Filtered contracts JSON (repo path)
        default: arms/Q2-pi-selective/contracts.actual.json
      model:
        description: Model that judges
        default: claude-haiku-5-5

concurrency:
  group: summary
  cancel-in-progress: false

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: query
      - name: Filter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          P=$(bash "suites/${{ inputs.suite }}/scripts/pristine.sh")
          mkdir -p "$(dirname "${{ inputs.output }}")"
          (cd query && node src/contracts-filter.ts "$P" "../${{ inputs.input }}" "../${{ inputs.output }}" --model "${{ inputs.model }}")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add arms
          git commit -qm "contracts-filter: ${{ inputs.output }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
