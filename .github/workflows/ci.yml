name: ci

# Self-check of the benchmark on every push: typecheck, then every task played
# by its reference solution through the real pipeline. No API calls, no cost.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            acceptance/package-lock.json
            harness/runner/package-lock.json
            query/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: acceptance
      - run: npm ci --no-audit --no-fund
        working-directory: harness/runner
      - run: npm ci --no-audit --no-fund   # the runner imports query/ for arm D
        working-directory: query
      - run: node --test test/*.test.ts
        working-directory: harness/runner
      - run: harness/validate.sh

  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: query/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: query
      - run: npx tsc --noEmit
        working-directory: query
      - run: node --test test/engine.test.ts test/server.test.ts test/cli.test.ts test/bundle.test.ts
        working-directory: query
