name: bench

# Real benchmark runs. Manual trigger only; costs API credits.
# Each matrix job: prepare workspace -> delete hidden tests and .git ->
# run agent -> fresh checkout -> evaluate. Records are committed to results/.
# Perf is skipped: shared runners are too noisy for latency numbers.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite (urlshort = small control, actual = Actual Budget)
        type: choice
        options: [urlshort, actual]
        default: urlshort
      arm:
        description: Arm
        type: choice
        options: [A-ts-baseline, B-ts-query, C-tersa-lang]
        default: A-ts-baseline
      tasks:
        description: Tasks, comma-separated (empty = all tasks of the suite)
        default: ""
      runs:
        description: Runs per task
        default: "5"
      first_run:
        description: Number of the first run (records are results/<arm>/<task>/run-<n>.json)
        default: "1"
      provider:
        description: Provider (secret ANTHROPIC_API_KEY or DEEPSEEK_API_KEY)
        type: choice
        options: [anthropic, deepseek]
        default: anthropic
      model:
        description: Model id (empty = provider default; deepseek-v4-flash / claude-sonnet-5-5)
        default: ""
      max_turns:
        description: Max agent turns per run
        default: "150"
      max_budget_usd:
        description: Hard spending cap per run, USD (run stops and is recorded as failed)
        default: "0.5"
      max_parallel:
        description: Max concurrent runs (keep low to avoid rate limits)
        default: "4"

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: m
        env:
          SUITE: ${{ inputs.suite }}
          TASKS: ${{ inputs.tasks }}
          RUNS: ${{ inputs.runs }}
          FIRST: ${{ inputs.first_run }}
        run: |
          node -e '
            let tasks = process.env.TASKS.split(",").map(s => s.trim()).filter(Boolean);
            if (!tasks.length) tasks = process.env.SUITE === "urlshort"
              ? ["T1", "T2", "T3", "T4", "T5"]
              : require(`./suites/${process.env.SUITE}/suite.json`).tasks;
            const n = Number(process.env.RUNS), f = Number(process.env.FIRST);
            const include = [];
            for (const task of tasks) for (let r = f; r < f + n; r++) include.push({ task, run: r });
            console.log("matrix=" + JSON.stringify({ include }));
          ' >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ARGS: --suite ${{ inputs.suite }} --arm ${{ inputs.arm }} --task ${{ matrix.task }} --run ${{ matrix.run }} --force
      ACTUAL_CACHE: ${{ github.workspace }}/../actual-cache
      RAW: /tmp/tersa-raw
      PROXY: http://127.0.0.1:8899
    steps:
      - uses: actions/checkout@v4
        with:
          path: bench
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runner
        working-directory: bench/harness/runner
        run: npm ci --no-audit --no-fund

      - name: Cache Yarn packages (actual suite)
        if: inputs.suite == 'actual'
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-actual-${{ hashFiles('bench/suites/actual/suite.json') }}

      - name: Prepare workspace
        env:
          RAW: /tmp/tersa-raw
        working-directory: bench/harness/runner
        run: node --disable-warning=ExperimentalWarning src/run.ts $ARGS --raw-dir "$RAW" --phase prepare

      - name: Hide tests, solutions and upstream source from the agent
        run: |
          rm -rf bench/acceptance bench/reference bench/perf bench/results bench/.git "$ACTUAL_CACHE"
          for d in bench/suites/*/; do
            rm -rf "$d/acceptance" "$d/scripts" "$d"/tasks/*/task.json "$d"/tasks/*/*.patch
            node -e 'const f=process.argv[1], s=require(f); require("fs").writeFileSync(f, JSON.stringify({ tasks: s.tasks }))' "$PWD/$d/suite.json"
          done
          find bench -name '*.test.ts' -path '*acceptance*' | grep . && exit 1 || true

      # The agent runs as user "agent". A firewall rejects all of that user's
      # traffic except to a local proxy, which only tunnels to the provider API.
      # Same policy for every arm. The next step proves it before the agent starts.
      - name: Isolate the agent's network
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          case "$PROVIDER" in deepseek) HOSTS=api.deepseek.com ;; anthropic) HOSTS=api.anthropic.com ;; esac
          echo "PROVIDER_HOST=$HOSTS" >> "$GITHUB_ENV"
          sudo useradd -m agent
          cp -r bench "$RUNNER_TEMP/agent-bench"
          sudo chown -R agent "$RUNNER_TEMP/agent-bench" "$RAW"
          sudo chmod o+x "$RUNNER_TEMP" /home/runner /home/runner/work
          nohup node bench/harness/sandbox/egress-proxy.mjs 8899 "$HOSTS" "$RUNNER_TEMP/egress.log" > /dev/null 2>&1 &
          for ipt in iptables ip6tables; do
            sudo $ipt -A OUTPUT -o lo -m owner --uid-owner agent -j ACCEPT
            sudo $ipt -A OUTPUT -m owner --uid-owner agent -j REJECT
          done
          sleep 1

      - name: Verify the isolation
        run: |
          as_agent() { sudo -u agent -H env HTTPS_PROXY="$PROXY" HTTP_PROXY="$PROXY" NO_PROXY= "$@"; }
          if as_agent curl -sS --max-time 10 -o /dev/null https://github.com; then echo "github.com reachable via proxy"; exit 1; fi
          if as_agent curl -sS --max-time 10 --noproxy '*' -o /dev/null https://github.com; then echo "github.com reachable directly"; exit 1; fi
          if as_agent curl -sS --max-time 10 --noproxy '*' -o /dev/null "https://$PROVIDER_HOST"; then echo "provider reachable without proxy"; exit 1; fi
          code=$(as_agent curl -s --max-time 15 -o /dev/null -w '%{http_code}' "https://$PROVIDER_HOST" || true)
          [ "$code" != "000" ] || { echo "provider not reachable through proxy"; exit 1; }
          echo "isolation ok: only $PROVIDER_HOST reachable (HTTP $code)"

      - name: Run agent
        working-directory: ${{ runner.temp }}/agent-bench/harness/runner
        env:
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ inputs.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || '' }}
          TERSA_MODEL: ${{ inputs.model }}
        run: |
          sudo -u agent -H env PATH="$PATH" HTTPS_PROXY="$PROXY" HTTP_PROXY="$PROXY" NO_PROXY= \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" TERSA_MODEL="$TERSA_MODEL" \
            CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 TERSA_NETWORK_POLICY=provider-only \
            node --disable-warning=ExperimentalWarning src/run.ts $ARGS --raw-dir "$RAW" --phase agent \
            --provider "${{ inputs.provider }}" --max-turns "${{ inputs.max_turns }}" \
            --max-budget-usd "${{ inputs.max_budget_usd }}"

      - name: Restore ownership
        if: always()
        run: |
          sudo chown -R "$(id -u)" "$RAW"
          cp "$RUNNER_TEMP/egress.log" "$RAW/egress.log" 2>/dev/null || true

      - uses: actions/checkout@v4
        with:
          path: eval
          persist-credentials: false
      - name: Install evaluation
        run: |
          (cd eval/acceptance && npm ci --no-audit --no-fund)
          (cd eval/harness/runner && npm ci --no-audit --no-fund)
          if [ "${{ inputs.suite }}" = actual ]; then (cd eval/suites/actual/acceptance && npm ci --no-audit --no-fund); fi
      - name: Evaluate
        working-directory: eval/harness/runner
        env:
          TERSA_EGRESS_LOG: /tmp/tersa-raw/egress.log
        run: node --disable-warning=ExperimentalWarning src/run.ts $ARGS --raw-dir "$RAW" --phase eval --skip-perf

      - uses: actions/upload-artifact@v4
        with:
          name: record-${{ matrix.task }}-${{ matrix.run }}
          path: eval/results/${{ inputs.arm }}/${{ matrix.task }}/run-${{ matrix.run }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.task }}-${{ matrix.run }}
          path: |
            /tmp/tersa-raw/${{ inputs.arm }}/${{ matrix.task }}/run-${{ matrix.run }}
            /tmp/tersa-raw/egress.log
            !/tmp/tersa-raw/**/node_modules/**
          retention-days: 30

  commit:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: record-*
          path: ${{ runner.temp }}/records
      - name: Place records and update summary
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = process.argv[1];
            if (!fs.existsSync(dir)) { console.log("no records"); process.exit(0); }
            for (const sub of fs.readdirSync(dir)) for (const f of fs.readdirSync(path.join(dir, sub))) {
              const r = JSON.parse(fs.readFileSync(path.join(dir, sub, f), "utf8"));
              const out = path.join("results", r.arm, r.task, `run-${r.run}.json`);
              fs.mkdirSync(path.dirname(out), { recursive: true });
              fs.copyFileSync(path.join(dir, sub, f), out);
              console.log(out);
            }
          ' "${{ runner.temp }}/records"
          if [ -d results ]; then node harness/runner/src/report.ts; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet && { echo "no records"; exit 0; }
          git commit -m "Bench results: ${{ inputs.suite }} ${{ inputs.arm }} ${{ inputs.tasks }} x${{ inputs.runs }} (${{ inputs.provider }} ${{ inputs.model }})"
          git pull --rebase
          git push
