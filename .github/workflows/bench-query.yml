name: bench-query

# Treatment arms, compared against bench-baseline (arm A): B = query layer as MCP tools,
# B2 = query layer as a shell command, D = task-scoped context bundle in the first prompt.
# Same steps as the other arm (see _bench.yml). Run both arms in the same
# period so a silent model update can't explain a difference.
on:
  workflow_dispatch:
    inputs:
      arm:
        description: B = query tools over MCP with redirects; B2 = tersa shell command; D = context bundle up front; F = exhaustive dispatch in the code; G = matcher/filter agreement test in the code; H = contract comments on functions; I = model-generated contracts; P = arm A's setup on the pi harness; Q = P + contracts appended where code is read
        type: choice
        options: [D-ts-bundle, Q-pi-contracts, P-pi-baseline, I-ts-gencontracts, H-ts-contracts, G-ts-agreement, F-ts-exhaustive, B2-ts-query-shell, B-ts-query]
        default: D-ts-bundle
      suite:
        description: Suite (urlshort = small control, actual = Actual Budget)
        type: choice
        options: [actual, urlshort]
        default: actual
      tasks:
        description: Tasks, comma-separated (empty = all tasks of the suite)
        default: ""
      runs:
        description: Runs per task
        default: "6"
      first_run:
        description: Number of the first run (records are results/<arm>/<task>/run-<n>.json)
        default: "1"
      provider:
        description: Provider (secret ANTHROPIC_API_KEY or DEEPSEEK_API_KEY)
        type: choice
        options: [deepseek, anthropic]
        default: deepseek
      model:
        description: Model id (empty = provider default; deepseek-v4-flash, claude-haiku-5-5)
        default: ""
      model_options:
        description: Model settings to vary, comma-separated (empty = SDK defaults; effort=low|medium|high, thinking=disabled)
        default: ""
      max_budget_usd:
        description: Hard spending cap per run, USD (empty = provider default; deepseek 0.5, anthropic 3)
        default: ""
      max_parallel:
        description: Max concurrent runs
        default: "3"

jobs:
  bench:
    uses: ./.github/workflows/_bench.yml
    with:
      arm: ${{ inputs.arm }}
      suite: ${{ inputs.suite }}
      tasks: ${{ inputs.tasks }}
      runs: ${{ inputs.runs }}
      first_run: ${{ inputs.first_run }}
      provider: ${{ inputs.provider }}
      model: ${{ inputs.model }}
      max_budget_usd: ${{ inputs.max_budget_usd }}
      model_options: ${{ inputs.model_options }}
      max_parallel: ${{ inputs.max_parallel }}
    secrets: inherit
    permissions:
      contents: write
